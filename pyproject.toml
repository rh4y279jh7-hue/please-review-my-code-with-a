[project]
name = "hivemind"
version = "0.1.0"
description = "HiveMind: orquestração multiagente com memória coletiva local"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.15.0",
    "chromadb==1.5.9",
    "fastapi==0.143.3",
    "google-genai==2.31.0",
    "langgraph==1.2.16",
    "numpy==2.5.4",
    "openai==3.33.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]

[project.scripts]
hivemind = "hivemind.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["hivemind"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "black==26.10.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]
