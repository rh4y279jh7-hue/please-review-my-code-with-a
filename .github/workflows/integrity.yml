name: Integrity
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  integridade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Guardião (versão da base, nunca a do PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          guard="$RUNNER_TEMP/integrity_guard.py"
          if git cat-file -e "$BASE_SHA:scripts/integrity_guard.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/integrity_guard.py" > "$guard"
          else
            # Primeira instalação: a base ainda não tem guardião.
            cp scripts/integrity_guard.py "$guard"
          fi
          python -I "$guard" --base "$BASE_SHA" --head "$HEAD_SHA" --labels "$LABELS"
