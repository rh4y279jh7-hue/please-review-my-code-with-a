name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run black --check .
      - name: Type check
        run: uv run mypy src/hivemind
      - name: Compose LAN override
        run: |
          lan="docker compose -f docker-compose.yml -f docker-compose.lan.yml"
          if HIVEMIND_API_TOKEN= $lan config -q 2>/dev/null; then
            echo "LAN override must require HIVEMIND_API_TOKEN" >&2
            exit 1
          fi
          ports="$(HIVEMIND_API_TOKEN=ci-placeholder-token-with-32-characters \
            $lan config --format json | jq -c '.services.hivemind.ports')"
          echo "$ports"
          test "$(jq 'length' <<<"$ports")" = 1
          test "$(jq -r '.[0].host_ip' <<<"$ports")" = 0.0.0.0
      - name: Offline tests with coverage
        run: uv run pytest --cov=hivemind --cov-report=term-missing --cov-report=xml
