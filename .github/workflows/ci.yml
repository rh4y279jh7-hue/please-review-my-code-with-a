name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run black --check .
      - name: Type check
        run: uv run mypy src/hivemind
      - name: Offline tests with coverage
        run: uv run pytest --cov=hivemind --cov-report=term-missing --cov-report=xml
